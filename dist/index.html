<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="保留文章排版，在英文原文中轻轻标出句子主干。"><title>句读 · 英文阅读批注</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%233b5f4d'/%3E%3Ctext x='32' y='46' font-size='42' text-anchor='middle' fill='white'%3E句%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body>
<header class="app-header"><a class="brand" href="./">句读<span>英文阅读批注</span></a><span id="save-status">已保存在浏览器</span><nav aria-label="文档操作"><button id="example-button">示例文章</button><button id="import-button">导入标注</button><button id="export-button">导出</button></nav></header>
<div class="toolbar" role="toolbar" aria-label="阅读与排版"><div class="toolbar-inner"><button id="edit-button" class="edit-button"><svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="m4 12 8-8 4 4-8 8H4v-4Zm7-7 4 4M3 18h14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>编辑 / 粘贴原文</button><span class="separator"></span><label class="annotation-toggle"><input type="checkbox" id="annotations-toggle" checked>主句主干</label><label class="annotation-toggle"><input type="checkbox" id="clauses-toggle" checked>从句 / 补充</label><div class="legend" aria-label="标注颜色"><span class="subject">主语</span><span class="predicate">谓语</span><span class="object">宾语 / 表语 / 补语</span></div><div class="font-controls"><button id="smaller-button" aria-label="缩小字号">A−</button><span id="font-size">22</span><button id="larger-button" aria-label="放大字号">A+</button></div><button id="print-button" class="print-button">打印</button></div></div>
<main class="desk"><div class="document-meta"><span>英文原文</span><span id="annotation-status"></span></div><article class="paper" aria-label="英文阅读文档"><div id="document-content" lang="en"></div></article><p class="reading-hint" id="reading-hint">实线标主句主干，虚线标从句内部成分。括号圈出边界，小字说明它接在哪里。</p></main>
<dialog id="edit-dialog"><div class="dialog-heading"><h2>粘贴原文</h2><button class="close-button" data-close aria-label="关闭">×</button></div><p>段落之间留一个空行，原文会按段落排版。</p><label class="visually-hidden" for="source-input">英文原文</label><textarea id="source-input" spellcheck="false" maxlength="20000" placeholder="把英文文章粘贴到这里…"></textarea><div class="edit-bottom"><span id="character-count"></span><button id="apply-button" class="primary-button">应用到文档</button></div><p id="edit-error" role="alert" class="error" hidden></p></dialog>
<dialog id="import-dialog"><div class="dialog-heading"><h2>导入主干标注</h2><button class="close-button" data-close aria-label="关闭">×</button></div><p>把你要读的文章发给我，我可以提供标注文件。在这里导入，文字仍然按完整文章显示。</p><label class="visually-hidden" for="import-input">标注 JSON</label><textarea id="import-input" spellcheck="false" placeholder="粘贴标注 JSON…"></textarea><div class="edit-bottom"><label class="file-button">选择 JSON 文件<input id="import-file" type="file" accept=".json,application/json"></label><button id="confirm-import" class="primary-button">导入到文档</button></div><p id="import-error" class="error" role="alert" hidden></p><button id="copy-prompt" class="copy-prompt">复制给 AI 的标注指令</button></dialog>
<div id="toast" role="status" class="toast" hidden></div>
</body>
</html>
